<!DOCTYPE html>
<html>
<head>

    <title>Login</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#667eea,#764ba2);

        }

        .login-container{

            width:380px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;
            margin-bottom:25px;
            color:#333;

        }

        input{

            width:100%;
            padding:13px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        input:focus{

            outline:none;
            border-color:#667eea;

        }

        button{

            width:100%;
            padding:13px;
            background:#667eea;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            background:#5563c1;

        }

        .message{

            background:#ffe6e6;
            color:red;
            border:1px solid red;
            padding:10px;
            border-radius:6px;
            margin-bottom:15px;
            text-align:center;

        }

        .register{

            text-align:center;
            margin-top:20px;

        }

        .register a{

            color:#667eea;
            text-decoration:none;
            font-weight:bold;

        }

        .register a:hover{

            text-decoration:underline;

        }

    </style>

</head>

<body>

<div class="login-container">

<h2>Login</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" action="{% url 'login' %}">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <button type="submit">

        Login

    </button>

</form>

<div class="register">

    Don't have an account?

    <a href="{% url 'register' %}">

        Register

    </a>

</div>

</div>

</body>
</html>
