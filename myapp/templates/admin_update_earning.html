<!DOCTYPE html>
<html>

<head>

<title>Update Earnings</title>

</head>


<body>


<h2>
Update Earnings
</h2>


<form method="POST">

{% csrf_token %}


<input

type="number"

name="amount"

value="{{ earning.amount }}"

required

>


<br><br>


<input

type="text"

name="reason"

value="{{ earning.reason }}"

required

>


<br><br>


<button type="submit">

Update

</button>


</form>


</body>

</html>
