<!DOCTYPE html>
<html>

<head>

<title>Add Expense</title>

</head>


<body>


<h2>
Add Expense for {{ selected_user.username }}
</h2>


<form method="POST">

{% csrf_token %}


<input 
type="number"
name="amount"
placeholder="Amount"
required>


<br><br>


<input 
type="text"
name="reason"
placeholder="Reason"
required>


<br><br>


<button type="submit">
Save Expense
</button>


</form>


</body>

</html>
