<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


body{

    background:linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
    min-height:100vh;

}


a{

    text-decoration:none;

}


/* Navbar */

.navbar{

    width:100%;
    background:rgba(255,255,255,.1);
    padding:15px 25px;
    backdrop-filter:blur(10px);

    display:flex;
    justify-content:space-between;
    align-items:center;

}



/* Username */

.welcome{

    color:white;
    font-size:22px;
    font-weight:bold;

}



/* Logout */

.logout{

    background:#198754;
    color:white;

    padding:12px 25px;

    border-radius:8px;

    font-size:16px;

    display:inline-block;

}



.logout:hover{

    opacity:.9;

}



/* Storage Message */

.storage-box{

    position:fixed;

    top:80px;
    right:20px;

    background:#ffc107;

    color:black;

    padding:12px 20px;

    border-radius:10px;

    font-weight:bold;

    z-index:1000;

}



/* Main */

.container{

    text-align:center;

    color:white;

    margin-top:70px;

}



.container h1{

    font-size:50px;

    margin-bottom:40px;

}



/* Cards */

.cards{

    display:flex;

    justify-content:center;

    gap:25px;

    flex-wrap:wrap;

}



.card{

    width:220px;

    height:140px;

    background:rgba(255,255,255,.15);

    border-radius:15px;

    display:flex;

    justify-content:center;

    align-items:center;

    transition:.3s;

}



.card:hover{

    transform:scale(1.05);

    background:white;

}



.card a{

    width:100%;

    height:100%;

    display:flex;

    justify-content:center;

    align-items:center;

    color:white;

    font-size:22px;

    font-weight:bold;

}



.card:hover a{

    color:#2563eb;

}



/* Clear Button */

.bottom{

    margin-top:60px;

}



.clear{

    background:#dc3545;

    color:white;

    padding:14px 30px;

    border:none;

    border-radius:8px;

    cursor:pointer;

    font-size:17px;

}



.clear:hover{

    opacity:.9;

}



/* Mobile */

@media(max-width:700px){


.navbar{

    padding:15px;

}


.welcome{

    font-size:16px;

}


.container h1{

    font-size:35px;

}


.card{

    width:90%;

}


.storage-box{

    top:70px;

    right:10px;

    font-size:13px;

}


}


</style>

</head>


<body>


<nav class="navbar">


<div class="welcome">

Welcome, {{ request.user.username }}

</div>



<a href="{% url 'logout' %}" class="logout">

🚪 Logout

</a>


</nav>



{% if storage %}

<div class="storage-box">

⚠ Database Storage Used:
{{ storage }}

</div>

{% endif %}





<div class="container">


<h1>
Expense Tracker
</h1>



<div class="cards">



<div class="card">

<a href="{% url 'earning' %}">

💰 Earnings

</a>

</div>




<div class="card">

<a href="{% url 'amount' %}">

💳 Expense

</a>

</div>




<div class="card">

<a href="{% url 'calendar' %}">

📅 Calendar

</a>

</div>




<div class="card">

<a href="{% url 'note' %}">

📝 Notes

</a>

</div>


</div>



<div class="bottom">


<form method="POST" action="{% url 'clear_all_data' %}">

{% csrf_token %}


<button class="clear" type="submit">

🗑 Clear All Data

</button>


</form>


</div>


</div>


</body>

</html>
