<!DOCTYPE html>
<html>

<head>

<title>Add Earnings</title>

</head>


<body>


<h2>
Add Earnings for {{ selected_user.username }}
</h2>


<form method="POST">

{% csrf_token %}


<input
type="number"
name="amount"
placeholder="Amount"
required>


<br><br>


<input
type="text"
name="reason"
placeholder="Reason"
required>


<br><br>


<button type="submit">

Save Earnings

</button>


</form>


</body>

</html>
