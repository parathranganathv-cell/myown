<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Expense Tracker</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    height:100vh;
    background:linear-gradient(135deg,#4f46e5,#2563eb,#06b6d4);
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    width:900px;
    height:500px;
    background:white;
    border-radius:20px;
    overflow:hidden;
    display:flex;
    box-shadow:0px 15px 40px rgba(0,0,0,.25);
}

.left{

    width:55%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8);
    color:white;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px;

}

.left h1{

    font-size:45px;
    margin-bottom:20px;

}

.left p{

    text-align:center;
    font-size:18px;
    line-height:30px;

}

.right{

    width:45%;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    padding:40px;

}

.right h2{

    margin-bottom:35px;
    color:#333;

}

.btn{

    width:250px;
    padding:15px;

    margin:15px 0;

    text-decoration:none;

    text-align:center;

    color:white;

    font-size:18px;

    border-radius:10px;

    transition:.3s;

}

.login{

    background:#2563eb;

}

.login:hover{

    background:#1d4ed8;
    transform:translateY(-4px);

}

.register{

    background:#10b981;

}

.register:hover{

    background:#059669;
    transform:translateY(-4px);

}

.footer{

    margin-top:30px;
    color:#777;
    font-size:14px;

}

@media(max-width:800px){

.container{

    width:95%;
    height:auto;
    flex-direction:column;

}

.left,
.right{

    width:100%;
    padding:40px 25px;

}

.left h1{

    font-size:35px;

}

}

</style>

</head>

<body>

<div class="container">

<div class="left">

<h1>Expense Tracker</h1>

<p>

Track your daily income, expenses, savings,
and manage your financial life easily.

</p>

</div>

<div class="right">

<h2>Welcome</h2>

<a href="{% url 'login' %}" class="btn login">

Login

</a>

<a href="{% url 'register' %}" class="btn register">

Register

</a>

<div class="footer">

© 2026 Expense Tracker

</div>

</div>

</div>

</body>
</html>
