<!DOCTYPE html>
<html>
<head>

    <title>Register</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{

            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#11998e,#38ef7d);

        }

        .register-container{

            width:380px;
            background:white;
            padding:35px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;
            margin-bottom:25px;
            color:#333;

        }

        input{

            width:100%;
            padding:13px;
            margin-bottom:18px;
            border:1px solid #ccc;
            border-radius:8px;
            font-size:15px;

        }

        input:focus{

            outline:none;
            border-color:#11998e;

        }

        button{

            width:100%;
            padding:13px;
            background:#11998e;
            color:white;
            border:none;
            border-radius:8px;
            font-size:17px;
            cursor:pointer;
            transition:.3s;

        }

        button:hover{

            background:#0d7d72;

        }

        .message{

            background:#ffe6e6;
            color:red;
            border:1px solid red;
            padding:10px;
            border-radius:6px;
            margin-bottom:15px;
            text-align:center;

        }

        .login{

            text-align:center;
            margin-top:20px;

        }

        .login a{

            color:#11998e;
            text-decoration:none;
            font-weight:bold;

        }

        .login a:hover{

            text-decoration:underline;

        }

    </style>

</head>

<body>

<div class="register-container">

<h2>Create Account</h2>

{% if messages %}
    {% for message in messages %}
        <div class="message">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}

<form method="POST" action="{% url 'register' %}">

    {% csrf_token %}

    <input
        type="text"
        name="username"
        placeholder="Username"
        required>

    <input
        type="password"
        name="password"
        placeholder="Password"
        required>

    <input
        type="password"
        name="confirm_password"
        placeholder="Confirm Password"
        required>

    <button type="submit">

        Register

    </button>

</form>

<div class="login">

    Already have an account?

    <a href="{% url 'login' %}">

        Login

    </a>

</div>

</div>

</body>
</html>
